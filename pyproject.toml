[project]
name = "recsys-ranking"
version = "0.1.0"
description = "Recommender ranking under a global-time split: does the model ordering by full-catalogue NDCG@10 survive the 100-sampled-negatives protocol?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "altair>=5.4"]
twotower = ["torch>=2.5"]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
recsys-ranking = "recsys_ranking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep this path and the [project.scripts] target above in step when renaming the package.
[tool.hatch.build.targets.wheel]
packages = ["src/recsys_ranking"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv]
# Resolve only releases at least two weeks old (supply-chain hygiene).
exclude-newer = "2026-10-09T00:00:00Z"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer model-fitting tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
