name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups --extra dashboard  # torch (two-tower) is local only; its tests skip

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Synthetic end-to-end smoke run
        run: uv run recsys-ranking evaluate --synthetic --smoke

      - name: Dashboard builds headless
        run: uv run recsys-ranking dashboard --check --out results/synthetic
